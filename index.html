<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2c200">
<meta name="robots" content="noindex">
<title>Canaril</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f6f5f0; --card: #ffffff; --tx: #1d1d1b; --mu: #6b6a63; --bd: #e3e1d8;
    --ac: #f2c200; --ac-tx: #1d1d1b; --ac-soft: #fff6cc;
    --ok: #2e7d4f; --ok-soft: #e3f3e8; --warn: #b45309; --warn-soft: #fdf0dc;
    --bad: #b42318; --bad-soft: #fde7e5; --info: #1d5fbf; --info-soft: #e6effc;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141412; --card: #1f1f1c; --tx: #f1f0ea; --mu: #a3a198; --bd: #34332e;
      --ac: #f2c200; --ac-tx: #1d1d1b; --ac-soft: #3a3214;
      --ok: #5cc28a; --ok-soft: #173325; --warn: #f0a548; --warn-soft: #3a2a12;
      --bad: #f2756a; --bad-soft: #3d1a17; --info: #7fb0f5; --info-soft: #172a45;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141412; --card: #1f1f1c; --tx: #f1f0ea; --mu: #a3a198; --bd: #34332e;
    --ac: #f2c200; --ac-tx: #1d1d1b; --ac-soft: #3a3214;
    --ok: #5cc28a; --ok-soft: #173325; --warn: #f0a548; --warn-soft: #3a2a12;
    --bad: #f2756a; --bad-soft: #3d1a17; --info: #7fb0f5; --info-soft: #172a45;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--tx); padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  .hidden { display: none !important; }
  [hidden] { display: none !important; }

  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ac); color: var(--ac-tx); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ac); }
  .top h1 { font-size: 18px; flex: 1; }
  .top button { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
  .top button:active { background: rgba(0,0,0,.08); }

  main { max-width: 760px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h2 { font-size: 17px; margin: 18px 0 8px; }
  h3 { font-size: 15px; margin: 14px 0 6px; }
  .mu { color: var(--mu); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .wrap { flex-wrap: wrap; }

  .tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; background: var(--card); border-top: 1px solid var(--bd); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabs button { flex: 1; min-width: 0; padding: 8px 1px 10px; font-size: 10.5px; color: var(--mu); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button span { font-size: 21px; line-height: 1.1; }
  .tabs button.on { color: var(--tx); font-weight: 600; }
  .tabs button.on span { transform: scale(1.1); }

  .subtabs { display: flex; gap: 6px; margin: 4px 0 10px; overflow-x: auto; }
  .subtabs button { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--bd); background: var(--card); white-space: nowrap; }
  .subtabs button.on { background: var(--tx); color: var(--bg); border-color: var(--tx); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 10px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--mu); }

  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .quick button { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; }
  .quick button span { font-size: 24px; }
  .quick button:active, .li:active { transform: scale(.98); }

  .search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--bd); background: var(--card); font-size: 16px; }
  .filters { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0; padding-bottom: 2px; }
  .filters select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); font-size: 14px; max-width: 170px; }

  .li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--bd); border-radius: 12px; margin-bottom: 6px; cursor: pointer; }
  .li b { font-variant-numeric: tabular-nums; }
  .li .r { text-align: right; flex-shrink: 0; }
  .sx { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
  .sx-M { background: var(--info-soft); color: var(--info); }
  .sx-F { background: var(--bad-soft); color: var(--bad); }
  .sx-I { background: var(--bd); color: var(--mu); }

  .bdg { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bd); color: var(--tx); white-space: nowrap; }
  .b-ok { background: var(--ok-soft); color: var(--ok); }
  .b-warn { background: var(--warn-soft); color: var(--warn); }
  .b-bad { background: var(--bad-soft); color: var(--bad); }
  .b-info { background: var(--info-soft); color: var(--info); }
  .b-ac { background: var(--ac-soft); color: var(--tx); }

  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; }
  .alert .ic { font-size: 20px; line-height: 1.2; }
  .a-bad { background: var(--bad-soft); border-color: var(--bad); }
  .a-warn { background: var(--warn-soft); }
  .a-info { background: var(--info-soft); }

  .eggs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .egg { width: 36px; height: 44px; border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; border: 2px solid var(--bd); background: var(--card); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .e-pendente { background: #f4f1e6; border-color: #cfc8ad; color: #6b6a63; }
  .e-fertil { background: #d8efdf; border-color: var(--ok); color: #1c5a37; }
  .e-infertil { background: #fffbe8; border-color: #d8cf9c; border-style: dashed; color: #8a7d3b; }
  .e-eclodido { background: var(--ac); border-color: #c79f00; color: #1d1d1b; }
  .e-quebrado { background: #fde7e5; border-color: var(--bad); color: var(--bad); text-decoration: line-through; }
  .e-perdido { background: #555; border-color: #333; color: #eee; }
  .egg.add { border-style: dashed; color: var(--mu); font-size: 20px; border-radius: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--mu); }
  .legend i { display: inline-block; width: 12px; height: 14px; border-radius: 50%; border: 2px solid; vertical-align: -2px; margin-right: 3px; }

  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); font-weight: 500; font-size: 14px; }
  .btn.pri { background: var(--ac); border-color: var(--ac); color: var(--ac-tx); font-weight: 700; }
  .btn.bad { color: var(--bad); border-color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn.full { width: 100%; padding: 13px; font-size: 16px; }
  .btn:active { filter: brightness(.95); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .grid2 div span { display: block; font-size: 12px; color: var(--mu); }
  a.lk, button.lk { color: var(--info); text-decoration: underline; padding: 0; }

  .tbl { overflow-x: auto; border: 1px solid var(--bd); border-radius: 12px; background: var(--card); margin-bottom: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--bd); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
  th { font-size: 12px; color: var(--mu); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  tfoot td { font-weight: 700; }

  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: 94vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
  .shead { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 0 6px; }
  .shead button { padding: 8px 10px; border-radius: 10px; font-size: 15px; }
  .shead button:last-child { font-size: 20px; }
  .sheet h2 { margin-top: 2px; }

  form .fld { margin-bottom: 12px; }
  form label { display: block; font-size: 13px; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
  form input:not([type=radio]):not([type=checkbox]), form select, form textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); font-size: 16px; }
  form textarea { resize: vertical; }
  .segs { display: flex; flex-wrap: wrap; gap: 6px; }
  label.seg { margin: 0; position: relative; color: var(--tx); font-size: 14px; }
  label.seg input { position: absolute; opacity: 0; pointer-events: none; }
  label.seg span { display: block; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--card); }
  label.seg input:checked + span { background: var(--ac); border-color: var(--ac); color: var(--ac-tx); font-weight: 700; }
  label.seg input:focus-visible + span { outline: 2px solid var(--info); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  label.chk { display: flex; gap: 8px; align-items: center; color: var(--tx); font-size: 15px; }
  label.chk input { width: 22px; height: 22px; }
  .factions { display: flex; gap: 8px; margin-top: 6px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  .factions .pri { flex: 1; padding: 13px; font-size: 16px; }

  .sync { font-size: 12px; font-weight: 600; opacity: .8; white-space: nowrap; }
  .dlg { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dbox { background: var(--card); color: var(--tx); border-radius: 16px; padding: 18px; max-width: 420px; width: 100%; }
  .dbox p { white-space: pre-line; margin-bottom: 14px; }
  .btn.pri.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  #toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
  #toast.on { opacity: 1; }
  .empty { text-align: center; color: var(--mu); padding: 28px 12px; }
  label.ck { padding: 6px 0; cursor: pointer; }
  label.ck .done { text-decoration: line-through; color: var(--mu); }
  .help ol, .help ul { padding-left: 20px; margin: 6px 0 12px; }
  .help li { margin-bottom: 4px; }
</style>
</head>
<body>

<header class="top">
  <h1>🐤 Canaril</h1>
  <span id="sync" class="sync" role="status"></span>
  <button data-act="menu" aria-label="Dados, exportação e ajuda">☰</button>
</header>

<main id="main"></main>

<nav class="tabs">
  <button data-act="tab" data-id="home"><span>🏠</span>Início</button>
  <button data-act="tab" data-id="aves"><span>🐤</span>Aves</button>
  <button data-act="tab" data-id="repro"><span>🥚</span>Reprodução</button>
  <button data-act="tab" data-id="manejo"><span>🩺</span>Manejo</button>
  <button data-act="tab" data-id="torneios"><span>🏆</span>Torneios</button>
  <button data-act="tab" data-id="rel"><span>📊</span>Relatórios</button>
</nav>

<div id="ov" class="ov hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="dlg" class="dlg hidden" role="alertdialog" aria-modal="true"><div class="dbox"><p id="dlgMsg"></p><div class="acts" style="justify-content:flex-end"><button class="btn" id="dlgNo">Cancelar</button><button class="btn pri" id="dlgYes">Confirmar</button></div></div></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
'use strict';
/* ============================================================
   Constantes e dicionários
   ============================================================ */
const KEY = 'canaril.v1';
const SIT = ['ativo', 'reprodutor', 'reservado', 'vendido', 'doado', 'morto', 'descartado'];
const SIT_ATIVA = ['ativo', 'reprodutor', 'reservado'];
const SIT_SAIDA = ['vendido', 'doado', 'morto', 'descartado'];
const SIT_BDG = { ativo: 'b-ok', reprodutor: 'b-ac', reservado: 'b-info', vendido: '', doado: '', morto: 'b-bad', descartado: '' };
const SEXO = { M: 'Macho', F: 'Fêmea', I: 'Indeterminado' };
const SEXO_IC = { M: '♂', F: '♀', I: '?' };
const OVO = { pendente: 'Não verificado', fertil: 'Fértil', infertil: 'Infértil', eclodido: 'Eclodido', quebrado: 'Quebrado', perdido: 'Perdido' };
const OVO_CURTO = { pendente: '?', fertil: 'Fértil', infertil: 'Claro', eclodido: 'Eclod.', quebrado: 'Quebr.', perdido: 'Perd.' };
const MANEJO = { pesagem: 'Pesagem', vermifugacao: 'Vermifugação', tratamento: 'Tratamento', vitamina: 'Vitamina/suplemento', anilhamento: 'Anilhamento', veterinario: 'Obs. veterinária', limpeza: 'Limpeza', outro: 'Outro' };
const MANEJO_IC = { pesagem: '⚖️', vermifugacao: '💊', tratamento: '💉', vitamina: '🧪', anilhamento: '💍', veterinario: '🩺', limpeza: '🧹', outro: '📝' };
const MANEJO_POR_AVE = ['pesagem', 'vermifugacao', 'tratamento', 'vitamina', 'anilhamento', 'veterinario'];
const SINAIS = { normal: 'Normal', fora: 'Fêmea fora do ninho', abandono: 'Sinal de abandono', ovofora: 'Ovo fora do ninho', problema: 'Outro problema' };
const CHOCO = { chocando: 'Chocando', concluido: 'Concluído', abandonado: 'Abandonado' };
const ESPECIES_PADRAO = [
  { id: 'esp-canario', nome: 'Canário', diasEclosao: 13, diaAnilhamento: 5, maturidadeDias: 150, diametroAnilha: '', obs: '' },
  { id: 'esp-periquito', nome: 'Periquito-australiano', diasEclosao: 18, diaAnilhamento: 6, maturidadeDias: 120, diametroAnilha: '', obs: '' },
  { id: 'esp-calopsita', nome: 'Calopsita', diasEclosao: 19, diaAnilhamento: 7, maturidadeDias: 180, diametroAnilha: '', obs: '' },
  { id: 'esp-agapornis', nome: 'Agapornis', diasEclosao: 23, diaAnilhamento: 8, maturidadeDias: 180, diametroAnilha: '', obs: '' },
  { id: 'esp-mandarim', nome: 'Diamante-mandarim', diasEclosao: 13, diaAnilhamento: 7, maturidadeDias: 90, diametroAnilha: '', obs: '' },
  { id: 'esp-gould', nome: 'Diamante-de-gould', diasEclosao: 15, diaAnilhamento: 8, maturidadeDias: 120, diametroAnilha: '', obs: '' }
];
const TIPO_EVENTO = { exposicao: 'Exposição (julgamento de plumagem)', canto: 'Concurso de canto', outro: 'Outro' };
const CHECKLIST_PADRAO = ['Separar as aves candidatas', 'Fazer a inscrição e pagar a taxa', 'Adaptar as aves à gaiola de exposição', 'Banho nas aves (3 a 5 dias antes)', 'Conferir anilhas e documentos', 'Preparar transporte, comida e água'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

/* ============================================================
   Utilidades
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').replace(/\s+/g, '').toUpperCase();
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // dias de a até b
const fmt = s => s ? s.split('-').reverse().join('/') : '—';
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (a, b) => b ? (Math.round(a / b * 1000) / 10).toLocaleString('pt-BR') + '%' : '—';
const isSA = an => /^S\/A/i.test(an || '');
function idade(d) {
  if (!d) return '';
  const n = diff(d, today());
  if (n < 0) return '';
  if (n < 60) return n + (n === 1 ? ' dia' : ' dias');
  if (n < 730) return Math.floor(n / 30.4) + ' meses';
  return (n / 365.25).toFixed(1).replace('.', ',') + ' anos';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ============================================================
   Banco de dados (localStorage)
   ============================================================ */
function blank() {
  return { aves: [], casais: [], posturas: [], ovos: [], chocos: [], chocoEventos: [], manejos: [], lembretes: [],
           especies: [], clubes: [], lotesAnilhas: [], eventos: [], inscricoes: [], perfil: {},
           cfg: { diasEclosao: 13, inicioTemporada: 7, ultimoBackup: '', especiePadrao: '' } };
}
/* Completa dados antigos: cria as espécies padrão e liga cada ave a uma espécie. Retorna true se mudou algo. */
function migrate(d) {
  let ch = false;
  ['especies', 'clubes', 'lotesAnilhas', 'eventos', 'inscricoes'].forEach(k => { if (!Array.isArray(d[k])) { d[k] = []; ch = true; } });
  if (!d.perfil || typeof d.perfil !== 'object' || Array.isArray(d.perfil)) { d.perfil = {}; ch = true; }
  if (!d.especies.length) {
    d.especies = ESPECIES_PADRAO.map(e => ({ ...e, diasEclosao: e.id === 'esp-canario' && +d.cfg.diasEclosao ? +d.cfg.diasEclosao : e.diasEclosao }));
    ch = true;
  }
  if (!d.especies.some(e => e.id === d.cfg.especiePadrao)) { d.cfg.especiePadrao = d.especies[0].id; ch = true; }
  d.aves.forEach(a => { if (!d.especies.some(e => e.id === a.especieId)) { a.especieId = d.cfg.especiePadrao; ch = true; } });
  return ch;
}
let storageOk = true;
let KEY_LOCAL = KEY; // com conta Supabase, cada usuário tem seu próprio cache neste aparelho
function load(key = KEY_LOCAL) {
  try {
    const s = localStorage.getItem(key);
    if (s) { const d = JSON.parse(s); const b = blank(); return { ...b, ...d, cfg: { ...b.cfg, ...(d.cfg || {}) } }; }
  } catch (e) { storageOk = false; }
  return blank();
}
let db = load();
migrate(db);
function saveLocal() {
  try { localStorage.setItem(KEY_LOCAL, JSON.stringify(db)); storageOk = true; }
  catch (e) { storageOk = false; }
}
function save() {
  saveLocal();
  if (cloud) scheduleSync();
  else if (!storageOk) toast('Não foi possível salvar no navegador. Exporte um backup!');
}

/* Sincronização na nuvem. Há dois "backends" com a mesma interface (get/set/del/getMany/watch):
   - claude.ai (quando a página é aberta como Artifact): área privada de cada pessoa em data/users/<id>/…
   - Supabase (versão independente, com login): tabela canaril_docs, protegida por RLS (cada usuário só vê as próprias linhas).
   Cada tabela é gravada em blocos de até CHUNK linhas; o documento "meta" lista os blocos. */
const SUPABASE_URL = 'https://eiqbpeezohahzizvffcu.supabase.co';
const SUPABASE_KEY = ''; // chave pública do projeto (Project Settings → API → "anon public" ou "publishable")
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const TABLES = ['aves', 'casais', 'posturas', 'ovos', 'chocos', 'chocoEventos', 'manejos', 'lembretes', 'especies', 'clubes', 'lotesAnilhas', 'eventos', 'inscricoes'];
const CHUNK = 300;
let cloud = null, stopWatch = null, syncTimer = null, syncing = false, syncAgain = false, cloudRev = '', syncState = 'local';
const myTag = uid(), lastSent = {};
function setSync(st, err) {
  syncState = st;
  const el = $('#sync');
  el.textContent = st === 'saving' ? '☁️ salvando…' : '';
  if (st === 'err' && err) toast(err.code === 'quota_exceeded' ? 'Espaço na nuvem esgotado. Exporte um backup.' : 'Falha ao salvar na nuvem; os dados seguem neste aparelho.');
}
function claudeBackend(d, base) {
  return {
    name: 'claude',
    async get(k) { const sn = await d.doc(base + '/' + k).get(); return sn.exists ? JSON.parse(JSON.stringify(sn.data())) : null; },
    async set(k, o) { await d.doc(base + '/' + k).set(o); },
    async del(k) { await d.doc(base + '/' + k).delete(); },
    async getMany(keys) { const r = await Promise.all(keys.map(k => this.get(k))); return Object.fromEntries(keys.map((k, i) => [k, r[i]])); },
    watch(cb, onErr) { return d.doc(base + '/meta').onSnapshot(sn => { if (sn.exists) cb(sn.data()); }, onErr); }
  };
}
function supabaseBackend(client, userId) {
  const T = 'canaril_docs';
  const chk = r => { if (r.error) throw { code: r.error.code === '42501' ? 'invalid_argument' : 'unavailable', message: r.error.message }; return r; };
  return {
    name: 'supabase',
    async get(k) { const r = chk(await client.from(T).select('dados').eq('chave', k).maybeSingle()); return r.data ? r.data.dados : null; },
    async set(k, o) { chk(await client.from(T).upsert({ user_id: userId, chave: k, dados: o, atualizado_em: new Date().toISOString() }, { onConflict: 'user_id,chave' })); },
    async del(k) { chk(await client.from(T).delete().eq('chave', k)); },
    async getMany(keys) { const r = chk(await client.from(T).select('chave,dados').in('chave', keys)); const m = {}; (r.data || []).forEach(x => m[x.chave] = x.dados); return m; },
    watch(cb) {
      // Sem realtime: confere o "meta" a cada 30 s e quando o app volta para a tela
      const tick = async () => { if (document.hidden) return; try { const m = await this.get('meta'); if (m) cb(m); } catch (e) { /* tenta de novo no próximo ciclo */ } };
      const iv = setInterval(tick, 30000);
      document.addEventListener('visibilitychange', tick); window.addEventListener('focus', tick);
      return () => { clearInterval(iv); document.removeEventListener('visibilitychange', tick); window.removeEventListener('focus', tick); };
    }
  };
}
function chunksOf(state) {
  const out = {};
  TABLES.forEach(t => {
    const rows = state[t] || [], n = Math.max(1, Math.ceil(rows.length / CHUNK));
    for (let i = 0; i < n; i++) out[t + '-' + i] = { rows: rows.slice(i * CHUNK, (i + 1) * CHUNK) };
  });
  return out;
}
function scheduleSync() {
  if (syncState === 'ro') return;
  setSync('saving'); clearTimeout(syncTimer); syncTimer = setTimeout(pushCloud, 700);
}
async function pushCloud() {
  if (!cloud) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  const alvo = cloud;
  try {
    const ch = chunksOf(db), keys = Object.keys(ch);
    for (const k of keys) {
      const js = JSON.stringify(ch[k]);
      if (lastSent[k] !== js) { await alvo.set(k, ch[k]); lastSent[k] = js; }
    }
    for (const k of Object.keys(lastSent)) if (!ch[k]) { await alvo.del(k); delete lastSent[k]; }
    cloudRev = uid();
    await alvo.set('meta', { chunks: keys, cfg: db.cfg, perfil: db.perfil || {}, rev: cloudRev, by: myTag, savedAt: new Date().toISOString() });
    setSync('ok');
  } catch (e) {
    if (e && e.code === 'invalid_argument') { setSync('ro'); render(); } else setSync('err', e);
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; pushCloud(); }
}
async function pullCloud(meta, src = cloud) {
  const docs = await src.getMany(meta.chunks);
  const nd = blank(); nd.cfg = { ...nd.cfg, ...(meta.cfg || {}) }; nd.perfil = { ...(meta.perfil || {}) };
  meta.chunks.forEach(k => {
    const t = k.slice(0, k.lastIndexOf('-')), d = docs[k];
    if (d && Array.isArray(nd[t])) { nd[t].push(...JSON.parse(JSON.stringify(d.rows || []))); lastSent[k] = JSON.stringify(d); }
  });
  db = nd; const mig = migrate(db); saveLocal(); render();
  if (mig) scheduleSync();
  if (stack.length && !stack[stack.length - 1].form) paint(true);
}
/* Liga um backend: baixa os dados da nuvem (ou envia os locais, se a nuvem estiver vazia) e passa a acompanhar mudanças */
async function conectarBackend(be, { legado = null, oferecerLocal = false } = {}) {
  cloud = be; Object.keys(lastSent).forEach(k => delete lastSent[k]); setSync('saving');
  try {
    const md = await be.get('meta');
    if (md) { cloudRev = md.rev; await pullCloud(md); setSync('ok'); }
    else if (legado && await legado.get('meta')) { await pullCloud(await legado.get('meta'), legado); Object.keys(lastSent).forEach(k => delete lastSent[k]); await pushCloud(); }
    else if (db.aves.length || db.casais.length) await pushCloud();
    else {
      setSync('ok');
      const local = oferecerLocal ? load(KEY) : null;
      if (local && local.aves.length) ask(`Encontramos ${local.aves.length} ave(s) salvas neste aparelho sem conta. Enviar esses dados para a sua conta?`, () => {
        db = local; migrate(db); save(); render(); toast('Dados enviados para a sua conta');
      }, { ok: 'Enviar para a conta' });
    }
    stopWatch = be.watch(m => {
      if (cloud !== be) return;
      if (m.by !== myTag && m.rev !== cloudRev) { cloudRev = m.rev; pullCloud(m).then(() => toast('Dados atualizados de outro aparelho')); }
    }, e => setSync('err', e));
  } catch (e) { setSync('err', e); }
}
function desconectarBackend() {
  if (stopWatch) { try { stopWatch(); } catch (e) { /* já encerrado */ } }
  stopWatch = null; cloud = null; clearTimeout(syncTimer); syncState = 'local';
  Object.keys(lastSent).forEach(k => delete lastSent[k]);
}
async function initClaude() {
  let d = null;
  try { d = await window.claude.use('db'); } catch (e) { d = null; }
  if (!d) return;
  let u = null, id = null;
  try { u = await window.claude.use('user'); id = u ? await u.id() : null; } catch (e) { id = null; }
  if (!id) return; // sem identificação: os dados ficam só neste navegador
  // Dados da primeira versão (área compartilhada "canaril"): só o dono os lê; são copiados para a área privada dele
  const legado = (await u.isOwner()) ? claudeBackend(d, 'canaril') : null;
  await conectarBackend(claudeBackend(d, 'data/users/' + id), { legado });
}

/* Conta (Supabase): login, cadastro, nova senha e uso sem conta */
let sb = null, sbUser = null, authGate = false, authModo = 'entrar', authMsg = '';
let recuperando = /type=recovery/.test(location.hash);
const temSupabase = () => !!(SUPABASE_URL && SUPABASE_KEY) && !(window.claude && window.claude.use);
function semConta() { try { return localStorage.getItem(KEY + ':semConta') === '1'; } catch (e) { return false; } }
function setSemConta(v) { try { v ? localStorage.setItem(KEY + ':semConta', '1') : localStorage.removeItem(KEY + ':semConta'); } catch (e) { /* sem armazenamento */ } }
function loadScript(src, global) {
  if (window[global]) return Promise.resolve(window[global]);
  return new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => window[global] ? res(window[global]) : rej(new Error(global)); sc.onerror = rej;
    document.head.appendChild(sc);
  });
}
async function iniciarSupabase() {
  authGate = true; authMsg = 'Conectando…'; render();
  try { await loadScript(SUPABASE_JS, 'supabase'); }
  catch (e) { authMsg = 'Sem conexão com o servidor. Verifique a internet ou use sem conta (dados só neste aparelho).'; render(); return; }

  sb.auth.onAuthStateChange((ev, session) => {
    // Não chamar o Supabase dentro deste callback: agenda para depois
    setTimeout(() => {
      if (ev === 'PASSWORD_RECOVERY') { recuperando = true; authModo = 'novaSenha'; authMsg = ''; authGate = true; render(); }
      if (session && session.user && (!sbUser || sbUser.id !== session.user.id)) entrar(session.user);
      if (ev === 'SIGNED_OUT' && sbUser) fecharSessao();
    }, 0);
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) entrar(data.session.user);

}
function entrar(user) {
  if (sbUser && sbUser.id === user.id) return;
  sbUser = user; KEY_LOCAL = KEY + ':' + user.id;
  db = load(); migrate(db); stack.length = 0; paint();
  if (recuperando) { authModo = 'novaSenha'; authGate = true; } else { authGate = false; authMsg = ''; view = 'home'; }
  render();
  conectarBackend(supabaseBackend(sb, user.id), { oferecerLocal: true });
}
function fecharSessao() {
  desconectarBackend(); sbUser = null; KEY_LOCAL = KEY;
  db = blank(); migrate(db); stack.length = 0; paint();
  authGate = true; authModo = 'entrar'; authMsg = ''; view = 'home'; render();
}
async function sairDaConta() {
  if (syncing || syncTimer) { clearTimeout(syncTimer); await pushCloud(); }
  try { await sb.auth.signOut(); } catch (e) { /* encerra localmente mesmo sem rede */ }
  fecharSessao(); toast('Você saiu da conta');
}
function traduzErro(e) {
  const m = (e && (e.message || e.msg)) || '';

  if (/email not confirmed/i.test(m)) return 'Confirme o seu e-mail pelo link que enviamos antes de entrar.';
  if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Toque em “Já tenho conta”.';
  if (/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.';
  if (/password/i.test(m) && /6|short|weak/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/fetch|network/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  return 'Não foi possível concluir: ' + m;
}

document.addEventListener('submit', async e => {
  if (e.target.id !== 'authForm') return;
  e.preventDefault();
  const f = e.target, email = f.email ? f.email.value.trim() : '', senha = f.senha ? f.senha.value : '';
  const volta = location.origin + location.pathname;
  if (f.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { authMsg = 'Informe um e-mail válido.'; render(); return; }
  if (f.senha && authModo !== 'entrar' && senha.length < 6) { authMsg = 'A senha precisa ter pelo menos 6 caracteres.'; render(); return; }
  if (f.senha && !senha) { authMsg = 'Informe a senha.'; render(); return; }
  f.querySelector('button[type=submit]').disabled = true;
  try {
    if (authModo === 'entrar') {
      const r = await sb.auth.signInWithPassword({ email, password: senha }); if (r.error) throw r.error;
      entrar(r.data.user);
    } else if (authModo === 'criar') {
      const r = await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: volta } }); if (r.error) throw r.error;
      if (r.data.session) entrar(r.data.user);
      else { authModo = 'entrar'; authMsg = `Conta criada! Abra o link que enviamos para ${email} para confirmar e depois entre.`; render(); }
    } else if (authModo === 'esqueci') {
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: volta }); if (r.error) throw r.error;
      authModo = 'entrar'; authMsg = 'Se o e-mail tiver conta, você vai receber um link para criar uma nova senha.'; render();
    } else if (authModo === 'novaSenha') {
      const r = await sb.auth.updateUser({ password: senha }); if (r.error) throw r.error;
      recuperando = false; history.replaceState(null, '', location.pathname);
      authGate = false; authMsg = ''; view = 'home';
      if (!sbUser) entrar(r.data.user); else render();
      toast('Senha alterada');
    }
  } catch (err) { authMsg = traduzErro(err); render(); }
});

/* Diálogo de confirmação (substitui confirm/alert, que podem ser bloqueados) */
function ask(msg, onYes, { ok = 'Confirmar', danger = false, only = false } = {}) {
  const dlg = $('#dlg'), yes = $('#dlgYes'), no = $('#dlgNo');
  $('#dlgMsg').textContent = msg;
  yes.textContent = only ? 'OK' : ok; yes.classList.toggle('danger', danger);
  no.classList.toggle('hidden', only);
  dlg.classList.remove('hidden'); yes.focus();
  const close = () => { dlg.classList.add('hidden'); yes.onclick = no.onclick = null; };
  yes.onclick = () => { close(); if (onYes && !only) onYes(); };
  no.onclick = close;
}
function delDone(extra = 0) { for (let i = 0; i < extra; i++) stack.pop(); done(); toast('Excluído'); }

/* Consultas */
const aveById = id => db.aves.find(a => a.id === id);
const ave = an => an ? db.aves.find(a => norm(a.anilha) === norm(an)) : null;
const casal = id => db.casais.find(c => c.id === id);
const postura = id => db.posturas.find(p => p.id === id);
const casalNome = c => c ? `${c.macho} × ${c.femea}` : '(casal removido)';
const casalAtivo = c => c && !c.dataSeparacao;
const ovosDe = pid => db.ovos.filter(o => o.posturaId === pid).sort((a, b) => a.ordem - b.ordem);
const chocoDe = pid => db.chocos.find(c => c.posturaId === pid);
const eventosDe = cid => db.chocoEventos.filter(e => e.chocoId === cid).sort((a, b) => b.data.localeCompare(a.data));
const filhotesDe = pid => db.aves.filter(a => a.posturaId === pid);
const ativa = a => SIT_ATIVA.includes(a.situacao);

function temporada(d) {
  if (!d) return '';
  const y = +d.slice(0, 4), m = +d.slice(5, 7), s = +db.cfg.inicioTemporada || 1;
  if (s === 1) return String(y);
  const a = m >= s ? y : y - 1;
  return a + '/' + String(a + 1).slice(2);
}
function temporadas() {
  const s = new Set([temporada(today())]);
  db.posturas.forEach(p => s.add(temporada(p.dataInicio)));
  db.aves.forEach(a => a.origem === 'nascido' && a.dataNascimento && s.add(temporada(a.dataNascimento)));
  return [...s].sort().reverse();
}
/* Espécies, clubes e lotes de anilhas */
const especie = id => db.especies.find(e => e.id === id);
const espAve = a => (a && especie(a.especieId)) || especie(db.cfg.especiePadrao) || db.especies[0] || ESPECIES_PADRAO[0];
const espPostura = p => { const c = casal(p.casalId); return espAve(ave(c?.femea) || ave(c?.macho)); };
const multiEsp = () => new Set(db.aves.map(a => a.especieId)).size > 1;
const clube = id => db.clubes.find(c => c.id === id);
const evento = id => db.eventos.find(e => e.id === id);
const optEspecies = () => db.especies.map(e => [e.id, e.nome]);
function loteAnilha(l, n) {
  const pf = l.prefixo ? (/[\s\-\/.]$/.test(l.prefixo) ? l.prefixo : l.prefixo + ' ') : '';
  return pf + String(n).padStart(+l.digitos || 0, '0');
}
function loteDaAnilha(an) {
  const r = norm(an);
  return db.lotesAnilhas.find(l => {
    const pf = norm(l.prefixo);
    if (!r.startsWith(pf)) return false;
    const rest = r.slice(pf.length);
    return /^\d+$/.test(rest) && +rest >= +l.inicio && +rest <= +l.fim;
  });
}
function loteUso(l) {
  const set = new Set(db.aves.map(a => norm(a.anilha)));
  let usadas = 0, prox = '';
  for (let n = +l.inicio; n <= +l.fim; n++) { if (set.has(norm(loteAnilha(l, n)))) usadas++; else if (!prox) prox = loteAnilha(l, n); }
  const total = Math.max(0, +l.fim - +l.inicio + 1);
  return { total, usadas, livres: total - usadas, prox };
}
/* Próximas anilhas livres dos lotes da espécie, do ano informado */
function proximasAnilhas(especieId, k, ano) {
  const set = new Set(db.aves.map(a => norm(a.anilha))), out = [];
  db.lotesAnilhas.filter(l => (!l.especieId || l.especieId === especieId) && (!l.ano || +l.ano === +ano))
    .forEach(l => { for (let n = +l.inicio; n <= +l.fim && out.length < k; n++) { const an = loteAnilha(l, n); if (!set.has(norm(an))) { out.push(an); set.add(norm(an)); } } });
  return out;
}
const clubeDaAve = a => clube(a.clubeId) || clube(loteDaAnilha(a.anilha)?.clubeId);
const inscricoesDe = an => db.inscricoes.filter(i => (i.anilhas || []).some(x => norm(x) === norm(an)));
const temPontos = i => i.pontos !== '' && i.pontos != null;
const medalha = c => ({ 1: '🥇', 2: '🥈', 3: '🥉' }[+c] || (+c ? '🏅' : '📝'));
const numBR = n => Number(n).toLocaleString('pt-BR');
function ultimoOvo(p) {
  const ov = ovosDe(p.id);
  return ov.length ? ov.map(o => o.data).sort().pop() : p.dataInicio;

/* Eclosão prevista: dias de incubação da espécie após o último ovo; se o choco começou depois do último ovo, conta a partir do choco */
function previsao(p) {
  const ch = chocoDe(p.id), ult = ultimoOvo(p);

  return addDays(base, +espPostura(p).diasEclosao || 13);
}
/* Dia da incubação contado até a eclosão prevista (último ovo ou início do choco) */

function filCasal(a) {

  const c = db.casais.find(c => norm(c.macho) === norm(a.pai) && norm(c.femea) === norm(a.mae));

}
function linCasal(c) {

  const lm = ave(c.macho)?.linhagem || '(sem linhagem)', lf = ave(c.femea)?.linhagem || '(sem linhagem)';

}
const statusFilhote = a => ['vendido', 'doado', 'morto'].includes(a.situacao) ? a.situacao : 'mantido';
function nextSA() { let i = 1; while (ave('S/A-' + i)) i++; return 'S/A-' + i; }
function uniq(k) {
  const s = new Set();

  if (k === 'local') db.casais.forEach(c => c.viveiro && s.add(c.viveiro));

/* Troca de anilha em cascata (pais, casais, manejos, chocos, inscrições) */
function renameRefs(de, para) {
  const n = norm(de);
  db.aves.forEach(a => { if (norm(a.pai) === n) a.pai = para; if (norm(a.mae) === n) a.mae = para; });
  db.casais.forEach(c => { if (norm(c.macho) === n) c.macho = para; if (norm(c.femea) === n) c.femea = para; });
  db.manejos.forEach(m => { if (norm(m.anilha) === n) m.anilha = para; });
  db.chocos.forEach(c => { if (norm(c.femea) === n) c.femea = para; });
  db.inscricoes.forEach(i => { i.anilhas = (i.anilhas || []).map(x => norm(x) === n ? para : x); });
}

/* ============================================================
   Indicadores
   ============================================================ */
function stats({ temp = '', casalId = '', linhagem = '', especieId = '' } = {}) {
  const okC = cid => (!casalId || cid === casalId) && (!linhagem || linCasal(casal(cid)) === linhagem);
  const P = db.posturas.filter(p => (!temp || temporada(p.dataInicio) === temp) && okC(p.casalId) && (!especieId || espPostura(p).id === especieId));
  const ids = new Set(P.map(p => p.id));
  const O = db.ovos.filter(o => ids.has(o.posturaId));
  const n = s => O.filter(o => o.status === s).length;
  const ecl = n('eclodido'), fert = n('fertil') + ecl;
  const Fil = db.aves.filter(a => {
    if (a.origem !== 'nascido') return false;
    if (temp && temporada(a.dataNascimento) !== temp) return false;
    if (especieId && espAve(a).id !== especieId) return false;
    if (casalId || linhagem) { const cid = filCasal(a); return cid && okC(cid); }
    return true;
  });
  const mortos = Fil.filter(a => a.situacao === 'morto').length;
  const nCasais = new Set(P.map(p => p.casalId)).size;
  return {
    posturas: P.length, nCasais, ovos: O.length, fert, ecl, inf: n('infertil'), queb: n('quebrado'), perd: n('perdido'), pend: n('pendente'),
    fil: Fil.length, mortos, vendidos: Fil.filter(a => a.situacao === 'vendido').length, doados: Fil.filter(a => a.situacao === 'doado').length,
    mantidos: Fil.filter(a => statusFilhote(a) === 'mantido').length,
    txFert: pct(fert, O.length), txEcl: pct(ecl, fert), txMort: pct(mortos, Fil.length),
    nat: nCasais ? (Fil.length / nCasais).toFixed(1).replace('.', ',') : '—'
  };
}
function resumo(inP, esp = '') {
  const r = { ovos: 0, nasc: 0, mortes: 0, vendas: 0, receita: 0, compras: 0, gasto: 0, manejos: 0 };
  db.ovos.forEach(o => { if (!inP(o.data)) return; const p = postura(o.posturaId); if (!esp || (p && espPostura(p).id === esp)) r.ovos++; });
  db.aves.forEach(a => {
    if (esp && espAve(a).id !== esp) return;
    if (a.origem === 'nascido' && inP(a.dataNascimento)) r.nasc++;
    if (a.situacao === 'morto' && inP(a.dataSaida)) r.mortes++;
    if (a.situacao === 'vendido' && inP(a.dataSaida)) { r.vendas++; r.receita += +a.valorVenda || 0; }
    if (a.origem === 'comprado' && inP(a.dataAquisicao)) { r.compras++; r.gasto += +a.valorPago || 0; }
  });
  db.manejos.forEach(m => { if (inP(m.data) && (!esp || (ave(m.anilha) && espAve(ave(m.anilha)).id === esp))) r.manejos++; });
  return r;
}
function mesesDaTemp(t) {
  const s = +db.cfg.inicioTemporada || 1, a = +t.slice(0, 4);
  return Array.from({ length: 12 }, (_, i) => (a + Math.floor((s - 1 + i) / 12)) + '-' + pad((s - 1 + i) % 12 + 1));
}
const mesLabel = k => MESES[+k.slice(5) - 1] + '/' + k.slice(2, 4);

/* ============================================================
   Alertas do dia
   ============================================================ */
function alertas() {
  const t = today(), L = [];
  db.posturas.filter(p => p.status === 'ativa').forEach(p => {
    const ov = ovosDe(p.id); if (!ov.length) return;
    const nome = casalNome(casal(p.casalId));
    if (!ov.some(o => o.status === 'eclodido')) {
      const prev = previsao(p), d = diff(t, prev);
      if (d < 0) L.push({ n: 5, c: 'bad', ic: '⚠️', tx: `Eclosão atrasada ${-d} dia(s)`, sub: `${nome} · prevista ${fmt(prev)}`, act: 'postura', id: p.id });
      else if (d === 0) L.push({ n: 4, c: 'warn', ic: '🐣', tx: 'Eclosão prevista para HOJE', sub: nome, act: 'postura', id: p.id });
      else if (d <= 2) L.push({ n: 3, c: 'warn', ic: '⏳', tx: `Eclosão em ${d} dia(s)`, sub: `${nome} · ${fmt(prev)}`, act: 'postura', id: p.id });
    }
    const pend = ov.filter(o => o.status === 'pendente' && diff(o.data, t) >= 6);
    if (pend.length) L.push({ n: 2, c: 'info', ic: '🔦', tx: `Ovoscopia: ${pend.length} ovo(s) com 6+ dias`, sub: nome, act: 'ovoscopia', id: p.id });
    const ch = chocoDe(p.id);
    if (ch && ch.status === 'chocando') {
      const ev = eventosDe(ch.id)[0];
      if (ev && (ev.sinal === 'abandono' || ev.sinal === 'problema')) L.push({ n: 5, c: 'bad', ic: '🪺', tx: `Choco: ${SINAIS[ev.sinal]}`, sub: `${ch.femea} · ${fmt(ev.data)}`, act: 'choco', id: p.id });
    }
    const sa = filhotesDe(p.id).filter(a => isSA(a.anilha) && ativa(a));
    if (sa.length) {
      const i = diff(sa[0].dataNascimento, t);
      const da = +espPostura(p).diaAnilhamento || 5;
      if (i >= da) L.push({ n: i > da + 4 ? 4 : 3, c: i > da + 4 ? 'bad' : 'warn', ic: '💍', tx: `Anilhar ${sa.length} filhote(s) — ${i} dias de vida`, sub: nome, act: 'anilharPost', id: p.id });
    }
  });
  db.lembretes.filter(l => l.ativo).forEach(l => {
    const d = diff(t, l.proxima);
    if (d <= 2) L.push({ n: d < 0 ? 4 : d === 0 ? 3 : 1, c: d < 0 ? 'bad' : d === 0 ? 'warn' : 'info', ic: MANEJO_IC[l.tipo] || '🔔', tx: l.titulo,
      sub: d < 0 ? `Vencido há ${-d} dia(s)` : d === 0 ? 'Hoje' : `Em ${d} dia(s) · ${fmt(l.proxima)}`, act: 'lemb', id: l.id });
  });
  const ind = db.aves.filter(a => a.sexo === 'I' && ativa(a) && a.dataNascimento && diff(a.dataNascimento, t) >= (+espAve(a).maturidadeDias || 150));
  if (ind.length) L.push({ n: 0, c: 'info', ic: '⚥', tx: `${ind.length} ave(s) já na idade de sexagem com sexo indeterminado`, sub: 'Toque para ver a lista', act: 'goSexoI' });
  db.eventos.forEach(e => {
    if (e.prazoInscricao) {
      const d = diff(t, e.prazoInscricao), n = db.inscricoes.filter(i => i.eventoId === e.id).length;
      if (d >= 0 && d <= 7) L.push({ n: d <= 2 ? 3 : 2, c: d <= 2 ? 'warn' : 'info', ic: '📝', tx: d === 0 ? `Inscrições encerram HOJE — ${e.nome}` : `Inscrições encerram em ${d} dia(s) — ${e.nome}`, sub: `${n} ave(s) inscrita(s) até agora`, act: 'evento', id: e.id });
    }
    if (e.dataInicio) {
      const d = diff(t, e.dataInicio), pend = (e.checklist || []).filter(c => !c.ok).length;
      if (d >= 0 && d <= 3) L.push({ n: 2, c: 'warn', ic: '🏆', tx: d === 0 ? `Campeonato hoje — ${e.nome}` : `Campeonato em ${d} dia(s) — ${e.nome}`, sub: pend ? `${pend} item(ns) de preparação pendente(s)` : 'Preparação concluída', act: 'evento', id: e.id });
    }
  });
  db.clubes.forEach(c => {
    if (!c.anuidadeValidade) return;
    const d = diff(t, c.anuidadeValidade);
    if (d <= 30) L.push({ n: d < 0 ? 3 : 1, c: d < 0 ? 'bad' : 'info', ic: '🏛️', tx: d < 0 ? `Anuidade vencida — ${c.sigla || c.nome}` : `Anuidade vence em ${d} dia(s) — ${c.sigla || c.nome}`, sub: 'Validade ' + fmt(c.anuidadeValidade), act: 'clubes' });
  });
  db.lotesAnilhas.forEach(l => {
    if (l.ano && +l.ano < +t.slice(0, 4)) return;
    const u = loteUso(l);
    if (u.total && u.livres <= 5) L.push({ n: 1, c: u.livres ? 'info' : 'warn', ic: '💍', tx: u.livres ? `Restam ${u.livres} anilha(s) no lote ${loteAnilha(l, l.inicio)}…` : `Lote ${loteAnilha(l, l.inicio)}… esgotado`, sub: clube(l.clubeId)?.nome || '', act: 'clubes' });
  });
  if (db.aves.length && !db.perfil.nome) L.push({ n: 0, c: 'info', ic: '👤', tx: 'Complete seu perfil de criador', sub: 'Nome, criatório, contato e clubes', act: 'perfil' });
  if (db.aves.length) {
    const b = db.cfg.ultimoBackup, d = b ? diff(b, t) : null;
    if (d === null || d > 30) L.push({ n: 0, c: 'info', ic: '💾', tx: 'Faça um backup dos dados', sub: b ? `Último backup há ${d} dias` : 'Nenhum backup feito ainda', act: 'backup' });
  }
  return L.sort((a, b) => b.n - a.n);
}

/* ============================================================
   Bottom sheet (pilha de telas) e formulários
   ============================================================ */
const ov = $('#ov'), sheet = $('#sheet'), stack = [];
function showSheet(ent) { stack.push(ent); paint(); }
function paint(keep) {
  if (!stack.length) { ov.classList.add('hidden'); document.body.style.overflow = ''; return; }
  const top = stack[stack.length - 1], st = sheet.scrollTop;
  sheet.innerHTML = `<div class="shead">${stack.length > 1 ? '<button data-act="back">‹ Voltar</button>' : '<span></span>'}<button data-act="close" aria-label="Fechar">✕</button></div>` + top.html();
  ov.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  sheet.scrollTop = keep ? st : 0;
  if (top.after) top.after();
}
function refresh() { save(); render(); if (stack.length && !stack[stack.length - 1].form) paint(true); }
function done() { save(); stack.pop(); render(); paint(); }
ov.addEventListener('click', e => { if (e.target === ov) { stack.length = 0; paint(); } });

function fieldHTML(f, v) {
  const val = v ?? '', id = 'f_' + f.k;
  let inp;
  if (f.t === 'select') {
    const opts = typeof f.o === 'function' ? f.o() : f.o;
    inp = `<select name="${f.k}" id="${id}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (f.t === 'seg') {
    inp = `<div class="segs" role="radiogroup">${f.o.map(([k, l]) => `<label class="seg"><input type="radio" name="${f.k}" value="${esc(k)}" ${String(k) === String(val) ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div>`;
  } else if (f.t === 'textarea') {
    inp = `<textarea name="${f.k}" id="${id}" rows="2" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  } else if (f.t === 'check') {
    return `<div class="fld" data-k="${f.k}"><label class="chk"><input type="checkbox" name="${f.k}" ${val ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
  } else if (f.t === 'info') {
    return `<div class="fld mu" data-k="${f.k}">${f.l}</div>`;
  } else {
    const t = f.t === 'number' ? 'text' : (f.t || 'text');
    inp = `<input name="${f.k}" id="${id}" type="${t}" value="${esc(val)}" ${f.list ? `list="dl_${f.list}"` : ''} ${f.t === 'number' ? 'inputmode="decimal"' : ''} ${f.req ? 'required' : ''} placeholder="${esc(f.ph || '')}" autocomplete="off">`;
  }
  return `<div class="fld" data-k="${f.k}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${inp}</div>`;
}
function readForm(form, fields) {
  const o = {};
  fields.forEach(f => {
    if (f.t === 'info') return;
    if (f.t === 'check') o[f.k] = form.elements[f.k].checked;
    else if (f.t === 'seg') o[f.k] = form.querySelector(`[name="${f.k}"]:checked`)?.value || '';
    else {
      let v = form.elements[f.k].value.trim();
      if (f.t === 'number' && v !== '') { v = Number(v.includes(',') ? v.replace(/\./g, '').replace(',', '.') : v); if (isNaN(v)) v = ''; }
      o[f.k] = v;
    }
  });
  fields.forEach(f => { if (f.show && !f.show(o) && f.t !== 'info') o[f.k] = f.t === 'check' ? false : ''; });
  return o;
}
function applyShow(ent) {
  const form = sheet.querySelector('form'); if (!form) return;
  const o = readForm(form, ent.fields);
  ent.fields.forEach(f => { if (f.show) form.querySelector(`[data-k="${f.k}"]`).classList.toggle('hidden', !f.show(o)); });
}
function datalists() {
  return ['cor', 'mutacao', 'linhagem', 'local', 'vendedor'].map(k => `<datalist id="dl_${k}">${uniq(k).map(v => `<option value="${esc(v)}">`).join('')}</datalist>`).join('') +
    `<datalist id="dl_anilha">${db.aves.filter(ativa).map(a => `<option value="${esc(a.anilha)}">`).join('')}</datalist>` +
    ['classe', 'juiz', 'premio'].map(k => `<datalist id="dl_${k}">${[...new Set(db.inscricoes.map(i => i[k]).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`).join('') +
    `<datalist id="dl_federacao">${[...new Set(['FOB', ...db.clubes.map(c => c.federacao).filter(Boolean)])].map(v => `<option value="${esc(v)}">`).join('')}</datalist>`;
}
function openForm(cfg) {
  const data = cfg.data || {};
  const ent = {
    form: true, fields: cfg.fields, save: cfg.save, del: cfg.del,
    html: () => `<form data-form novalidate><h2>${esc(cfg.title)}</h2>${cfg.intro || ''}${cfg.fields.map(f => fieldHTML(f, data[f.k])).join('')}${datalists()}
      <div class="factions"><button type="submit" class="btn pri">${esc(cfg.ok || 'Salvar')}</button>${cfg.del ? '<button type="button" class="btn bad" data-act="fdel">Excluir</button>' : ''}</div></form>`,
    after: () => applyShow(ent)
  };
  showSheet(ent);
}
sheet.addEventListener('submit', e => {
  e.preventDefault();
  const top = stack[stack.length - 1]; if (!top || !top.form) return;
  const o = readForm(e.target, top.fields);
  const miss = top.fields.find(f => f.req && (o[f.k] === '' || o[f.k] == null) && !(f.show && !f.show(o)));
  if (miss) { toast('Preencha: ' + miss.l); return; }
  const err = top.save(o);
  if (err) { toast(err); return; }
  done();
});
sheet.addEventListener('input', () => { const top = stack[stack.length - 1]; if (top && top.form) applyShow(top); });

      if (a) {
        if (a.anilha !== o.anilha) renameRefs(a.anilha, o.anilha);

function criarFilhotes(p, n, data, anilhas, cor, semOvos) {
  const c = casal(p.casalId), pai = ave(c?.macho), mae = ave(c?.femea);
  const ov = ovosDe(p.id).filter(o => o.status === 'fertil' || o.status === 'pendente');
  for (let i = 0; i < n; i++) {
    if (!semOvos && ov[i]) ov[i].status = 'eclodido';
    const an = anilhas[i] || nextSA();
    db.aves.push({ id: uid(), anilha: an, origem: 'nascido', vendedor: '', dataAquisicao: '', valorPago: '', anilhaOriginal: '',
      dataNascimento: data, pai: c?.macho || '', mae: c?.femea || '', posturaId: p.id, sexo: 'I', cor: cor || '', mutacao: '',
      linhagem: pai?.linhagem || mae?.linhagem || '', situacao: 'ativo', local: c?.viveiro || '', obs: '', dataSaida: '', motivoSaida: '', valorVenda: '',
      especieId: (mae || pai)?.especieId || db.cfg.especiePadrao, clubeId: '' });
    if (anilhas[i]) db.manejos.push({ id: uid(), anilha: an, local: '', data: today(), tipo: 'anilhamento', peso: '', produto: '', dose: '', obs: 'Anilhado no registro do nascimento' });
  }
  const ch = chocoDe(p.id); if (ch && ch.status === 'chocando') ch.status = 'concluido';
}
function formNasc(pid) {
  const p = postura(pid), ov = ovosDe(pid);
  const cand = ov.filter(o => o.status === 'fertil' || o.status === 'pendente').length;
  const esp = espPostura(p), sug = proximasAnilhas(esp.id, 3, today().slice(0, 4));
  openForm({
    title: '🐣 Nascimento — ' + casalNome(casal(p.casalId)), data: { data: today(), qtd: Math.max(1, cand) }, ok: 'Registrar nascimento',
    intro: `<p class="mu" style="margin-bottom:10px">${cand} ovo(s) férteis/não verificados nesta postura. Eles serão marcados como eclodidos na ordem.</p>`,
    fields: [
      { k: 'data', l: 'Data do nascimento', t: 'date', req: 1 },
      { k: 'qtd', l: 'Quantos filhotes nasceram?', t: 'number', req: 1 },
      { k: 'anilhas', l: 'Anilhas (uma por linha) — opcional', t: 'textarea', ph: `Deixe vazio: o sistema cria “S/A-1”, “S/A-2”… e avisa a hora de anilhar (a partir do ${esp.diaAnilhamento || 5}º dia)` },
      ...(sug.length ? [{ k: 'usarLote', l: `Anilhar agora com as próximas anilhas livres (${sug.join(', ')}…)`, t: 'check' }] : []),
      { k: 'cor', l: 'Cor dos filhotes (opcional)', list: 'cor' }
    ],
    save: o => {
      const n = parseInt(o.qtd) || 0;
      if (n < 1 || n > 10) return 'Informe entre 1 e 10 filhotes';
      let an = o.anilhas.split(/\n+/).map(s => s.trim()).filter(Boolean);
      if (!an.length && o.usarLote) an = proximasAnilhas(esp.id, n, o.data.slice(0, 4));
      if (an.length > n) return 'Há mais anilhas que filhotes';
      if (new Set(an.map(norm)).size !== an.length) return 'Há anilhas repetidas';
      const dup = an.find(x => ave(x)); if (dup) return 'A anilha ' + dup + ' já existe';
      criarFilhotes(p, n, o.data, an, o.cor);
      toast(`🐣 ${n} filhote(s) registrado(s)`);
    }
  });
}

VIEWS.torneios = () => {
  const head = subtabs('torneios', [['eventos', '🏆 Eventos'], ['resultados', '📈 Resultados']]);
  if (sub.torneios === 'resultados') return head + resultadosHTML();

  return head + `<div class="filters">${sel('ev.st', [['proximos', 'Próximos'], ['passados', 'Realizados'], ['', 'Todos']], F.ev.st, 'Período')}</div>
    <div id="list"></div><button class="btn pri full" data-act="novoEvento">＋ Novo campeonato / exposição</button>`;
};
function eventoStatus(e) {
  const t = today(), fim = e.dataFim || e.dataInicio;
  if (!e.dataInicio) return ['', 'Sem data'];
  if (fim < t) return ['', 'Realizado'];
  if (e.dataInicio <= t) return ['b-warn', 'Acontecendo'];
  if (e.prazoInscricao && e.prazoInscricao >= t) { const p = diff(t, e.prazoInscricao); return [p <= 2 ? 'b-warn' : 'b-info', p === 0 ? 'Inscrições até hoje' : `Inscrições: ${p}d`]; }
  return ['b-info', `Em ${diff(t, e.dataInicio)} dia(s)`];
}
const periodo = e => fmt(e.dataInicio) + (e.dataFim && e.dataFim !== e.dataInicio ? ' a ' + fmt(e.dataFim) : '');
function eventosList() {
  const t = today(), st = F.ev.st;
  const r = db.eventos.filter(e => { const fim = e.dataFim || e.dataInicio || ''; return !st || (st === 'proximos' ? !fim || fim >= t : fim && fim < t); })
    .sort((a, b) => st === 'passados' ? (b.dataInicio || '').localeCompare(a.dataInicio || '') : (a.dataInicio || '9').localeCompare(b.dataInicio || '9'));
  return r.length ? r.map(e => {
    const [cls, tx] = eventoStatus(e), ins = db.inscricoes.filter(i => i.eventoId === e.id);
    const pod = ins.filter(i => +i.colocacao >= 1 && +i.colocacao <= 3).length, org = clube(e.clubeId);
    return `<div class="li" data-act="evento" data-id="${e.id}"><div class="sx sx-I">${e.tipo === 'canto' ? '🎵' : '🏆'}</div>
      <div class="grow"><b>${esc(e.nome)}</b><div class="mu">${periodo(e)}${e.local ? ' · ' + esc(e.local) : ''}</div>
      <div class="mu">${esc(org?.sigla || org?.nome || e.organizador || '')}${ins.length ? ` · ${ins.length} inscrição(ões)` : ''}${pod ? ` · ${pod} pódio(s)` : ''}</div></div>
      <span class="bdg ${cls}">${tx}</span></div>`;
  }).join('') : '<div class="empty">Nenhum evento aqui. Cadastre o próximo campeonato para receber os alertas de prazo de inscrição.</div>';
}

function resultadosHTML() {
  if (!db.inscricoes.length) return '<div class="empty">Nenhuma inscrição ainda. Cadastre um evento em “Eventos” e inscreva suas aves.</div>';
  const J = db.inscricoes.filter(i => temPontos(i) || i.colocacao);
  const pts = J.filter(i => temPontos(i) && i.modalidade !== 'equipe').map(i => +i.pontos), avg = L => L.length ? L.reduce((a, b) => a + b, 0) / L.length : 0;
  const pod = J.filter(i => +i.colocacao >= 1 && +i.colocacao <= 3).length, ouro = J.filter(i => +i.colocacao === 1).length;
  const grp = keyFn => {
    const m = {};
    J.filter(i => i.modalidade !== 'equipe').forEach(i => (i.anilhas || []).forEach(an => {
      const a = ave(an), k = a && keyFn(a); if (!k) return;
      const g = m[k] = m[k] || { n: 0, pts: [], pod: 0, best: 0 };
      g.n++; if (temPontos(i)) { g.pts.push(+i.pontos); g.best = Math.max(g.best, +i.pontos); }
      if (+i.colocacao >= 1 && +i.colocacao <= 3) g.pod++;
    }));
    return Object.entries(m).sort((a, b) => b[1].pod - a[1].pod || avg(b[1].pts) - avg(a[1].pts));
  };
  const tbl = (titulo, col, rows) => rows.length ? `<h3>${titulo}</h3><div class="tbl"><table><thead><tr><th>${col}</th><th>Particip.</th><th>Pódios</th><th>Média</th><th>Melhor</th></tr></thead><tbody>
    ${rows.map(([k, g]) => `<tr><td>${esc(k)}</td><td>${g.n}</td><td>${g.pod}</td><td>${g.pts.length ? avg(g.pts).toFixed(1).replace('.', ',') : '—'}</td><td>${g.best || '—'}</td></tr>`).join('')}</tbody></table></div>` : '';
  const hist = [...db.inscricoes].sort((a, b) => (evento(b.eventoId)?.dataInicio || '').localeCompare(evento(a.eventoId)?.dataInicio || ''));
  return `<div class="kpis">
      <div class="kpi"><b>${db.inscricoes.length}</b><span>inscrições</span></div>
      <div class="kpi"><b>${pod}</b><span>pódios (1º a 3º)</span></div>
      <div class="kpi"><b>${ouro}</b><span>1º lugares</span></div>
      <div class="kpi"><b>${pts.length ? avg(pts).toFixed(1).replace('.', ',') : '—'}</b><span>média de pontos (individual)</span></div>
    </div>
    ${tbl('Ranking por linhagem', 'Linhagem', grp(a => a.linhagem))}
    ${tbl('Ranking por casal (pais)', 'Casal', grp(a => a.origem === 'nascido' && a.pai && a.mae ? `${a.pai} × ${a.mae}` : ''))}
    <h3>Histórico</h3>${hist.map(inscLi).join('')}
    <p class="mu">Os rankings consideram inscrições individuais já julgadas.</p>`;
}

/* Salva um arquivo: pela permissão de download do claude.ai quando disponível, senão por link direto */
async function download(content, name, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  let dl = null;
  if (window.claude && window.claude.use) { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); return true; }
    catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo.'); return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return true;
}

  P(c2, -372, ['eclodido', 'eclodido', 'eclodido', 'quebrado'], { choco: -371, hatch: { d: -356, f: [{ anilha: h25(), sexo: 'F', situacao: 'doado', dataSaida: D(-200), motivoSaida: 'Doado ao clube de canaricultura' }, { anilha: h25(), sexo: 'M', situacao: 'reservado' }, { anilha: h25(), sexo: 'F' }] } });
  P(c3, -418, ['eclodido', 'eclodido', 'infertil', 'infertil'], { choco: -417, hatch: { d: -402, f: [{ anilha: h25(), sexo: 'M' }, { anilha: h25(), sexo: 'F', ...vend(-130, 'Marcos A.', 300) }] } });
  P(c3, -365, ['infertil', 'infertil', 'perdido'], { choco: -364, obs: 'Postura sem filhotes' });
  P(c4, -415, ['eclodido', 'eclodido', 'eclodido', 'fertil'], { choco: -414, hatch: { d: -399, f: [{ anilha: h25(), sexo: 'M' }, { anilha: h25(), sexo: 'F' }, { anilha: h25(), sexo: 'F', ...morto(-390, 'Fraco, não se alimentou') }] } });
  // Temporada atual
  P(c2, -62, ['eclodido', 'eclodido', 'eclodido', 'infertil', 'infertil'], { status: 'encerrada', choco: -60, hatch: { d: -46, f: [{ anilha: h26() }, { anilha: h26() }, { anilha: 'S/A-1', ...morto(-43, 'Não foi alimentado pela fêmea') }] } });
  P(c1, -40, ['eclodido', 'eclodido', 'eclodido', 'infertil'], { status: 'encerrada', choco: -38, hatch: { d: -24, f: [{ anilha: h26() }, { anilha: h26() }, { anilha: h26() }] } });
  P(c6, -21, ['eclodido', 'eclodido', 'eclodido', 'quebrado'], { choco: -20, hatch: { d: -7, f: [{ anilha: 'S/A-2' }, { anilha: 'S/A-3' }, { anilha: 'S/A-4' }] } });
  const p3 = P(c3, -18, ['fertil', 'fertil', 'fertil', 'fertil', 'infertil'], { choco: -17 });
  const p2 = P(c2, -16, ['fertil', 'fertil', 'fertil', 'infertil'], { choco: -15 });
  const p5 = P(c5, -12, ['pendente', 'pendente', 'pendente', 'pendente'], { choco: -11 });
  P(c1, -3, ['pendente', 'pendente', 'pendente']);
  P(c7, -20, ['fertil', 'fertil', 'fertil', 'fertil', 'infertil'], { choco: -19, gap: 2 });
  const ev = (p, d, al, s, o) => db.chocoEventos.push({ id: uid(), chocoId: chocoDe(p.id).id, data: D(d), alimentacaoExtra: al, sinal: s, obs: o });
  ev(p3, -10, true, 'normal', 'Farinhada com ovo'); ev(p3, -1, false, 'fora', 'Fêmea saindo muito do ninho');
  ev(p2, -5, true, 'normal', 'Farinhada com ovo e couve'); ev(p5, -2, true, 'normal', '');

  // Manejo
  const M = (anilha, d, tipo, o = {}) => db.manejos.push({ id: uid(), anilha, local: ave(anilha)?.local || '', data: D(d), tipo, peso: '', produto: '', dose: '', obs: '', ...o });
  db.aves.filter(a => a.situacao === 'reprodutor').forEach((a, i) => {
    M(a.anilha, -75, 'vermifugacao', { produto: 'Ivermectina 0,5%', dose: '1 gota no dorso' });
    M(a.anilha, -30, 'pesagem', { peso: 22 + (i % 5) + (i % 2) * 0.5 });
  });
  ['HG 26 001', 'HG 26 002', 'HG 26 003', 'HG 26 004', 'HG 26 005'].forEach((an, i) => M(an, -10, 'pesagem', { peso: 18 + i * 0.5 }));
  M('NV 24 015', -50, 'tratamento', { produto: 'Doxiciclina', dose: 'Na água por 5 dias', obs: 'Espirros; recuperada' });
  M('RB 24 211', -20, 'veterinario', { obs: 'Muda de penas atrasada; reforçar suplementação' });
  M('AG 24 120', -15, 'pesagem', { peso: 24.5 });
  db.manejos.push({ id: uid(), anilha: '', local: 'Todos os viveiros', data: D(-8), tipo: 'limpeza', peso: '', produto: '', dose: '', obs: 'Troca de forro e lavagem de bebedouros' });

  const L = (titulo, tipo, int, prox, alvoTipo, alvo = '') => db.lembretes.push({ id: uid(), titulo, tipo, intervaloDias: int, proxima: D(prox), alvoTipo, alvo, ativo: true, obs: '' });
  L('Vermifugação do plantel', 'vermifugacao', 90, 15, 'todas');
  L('Limpeza das gaiolas e viveiros', 'limpeza', 7, -1, 'geral');
  L('Vitamina na água', 'vitamina', 15, 0, 'todas');
  L('Pesagem dos reprodutores', 'pesagem', 30, 2, 'geral');
  L('Troca dos ninhos', 'limpeza', 30, 10, 'geral');

  // Clubes, lotes de anilhas e campeonatos
  const ano = +T.slice(0, 4);
  const cl1 = { id: uid(), nome: 'Clube Ornitológico Exemplo', sigla: 'COE', federacao: 'FOB', numeroCriador: 'HG-0457', anuidadeValidade: D(20), contato: '', obs: 'Dados de exemplo' };
  const cl2 = { id: uid(), nome: 'Associação de Criadores Exemplo', sigla: 'ACE', federacao: '', numeroCriador: '1182', anuidadeValidade: D(200), contato: '', obs: 'Dados de exemplo' };
  db.clubes.push(cl1, cl2);
  db.lotesAnilhas.push(
    { id: uid(), clubeId: cl1.id, ano: ano - 1, especieId: 'esp-canario', prefixo: 'HG 25', inicio: 1, fim: 20, digitos: 3, diametro: '2,9 mm', obs: '' },
    { id: uid(), clubeId: cl1.id, ano, especieId: 'esp-canario', prefixo: 'HG 26', inicio: 1, fim: 30, digitos: 3, diametro: '2,9 mm', obs: '' },
    { id: uid(), clubeId: cl2.id, ano, especieId: 'esp-periquito', prefixo: 'ACE 26', inicio: 1, fim: 8, digitos: 2, diametro: '4,0 mm', obs: '' });
  const E = (o) => { const e = { id: uid(), tipo: 'exposicao', organizador: '', local: '', dataFim: '', prazoInscricao: '', taxa: '', obs: '', checklist: CHECKLIST_PADRAO.map(t => ({ t, ok: false })), ...o }; db.eventos.push(e); return e; };
  const I = (e, anilhas, o = {}) => db.inscricoes.push({ id: uid(), eventoId: e.id, modalidade: anilhas.length > 1 ? 'equipe' : 'individual', anilhas, classe: '', juiz: '', pontos: '', colocacao: '', premio: '', obs: '', ...o });
  const ev1 = E({ nome: 'Exposição Regional de Canários', clubeId: cl1.id, local: 'Ginásio Municipal', dataInicio: D(-330), dataFim: D(-328), prazoInscricao: D(-345), taxa: 15 });
  ev1.checklist.forEach(c => c.ok = true);
  I(ev1, ['HG 25 003'], { classe: 'Lipocromo amarelo intenso', juiz: 'Carlos M.', pontos: 91, colocacao: 1, premio: 'Medalha de ouro', obs: 'Cor 28 · plumagem 19 · porte 9 · condição 9' });
  I(ev1, ['HG 25 007'], { classe: 'Vermelho mosaico', juiz: 'Carlos M.', pontos: 89, colocacao: 2, premio: 'Medalha de prata' });
  I(ev1, ['HG 25 013'], { classe: 'Branco dominante', juiz: 'Ana P.', pontos: 86, colocacao: 5 });
  I(ev1, ['HG 25 006', 'HG 25 007', 'HG 25 011', 'HG 25 012'], { classe: 'Equipe vermelho mosaico', juiz: 'Carlos M.', pontos: 352, colocacao: 2, premio: 'Troféu de equipe' });
  const ev2 = E({ nome: 'Campeonato Estadual de Canaricultura', clubeId: cl1.id, local: 'Centro de Eventos', dataInicio: D(19), dataFim: D(21), prazoInscricao: D(5), taxa: 20 });
  ev2.checklist[0].ok = true;
  I(ev2, ['HG 25 003'], { classe: 'Lipocromo amarelo intenso' });
  I(ev2, ['HG 25 016'], { classe: 'Ágata canela' });
  E({ nome: 'Mostra de Periquitos', clubeId: cl2.id, local: 'Sede da associação', dataInicio: D(60), prazoInscricao: D(45), taxa: 10 });

  save(); stack.length = 0; paint(); view = 'home'; render();
  toast('Dados de exemplo carregados');
}

/* ============================================================
   Ações (delegação de eventos)
   ============================================================ */
const ACT = {
  tab: v => { view = v; render(); window.scrollTo(0, 0); },
  sub: (v, el) => { sub[el.dataset.g] = v; render(); },
  back: () => { stack.pop(); paint(); },
  close: () => { stack.length = 0; paint(); },
  fdel: () => { const top = stack[stack.length - 1]; if (top.del) top.del(); },
  menu: () => showSheet(sDados()),
  auModo: m => { authModo = m; authMsg = ''; render(); },
  semConta: () => { setSemConta(true); authGate = false; KEY_LOCAL = KEY; db = load(); migrate(db); view = 'home'; render(); toast('Usando sem conta: os dados ficam só neste aparelho'); },
  comConta: () => { setSemConta(false); stack.length = 0; paint(); if (sb) { authGate = true; authModo = 'entrar'; authMsg = ''; render(); } else iniciarSupabase(); },
  sair: () => ask('Sair da conta neste aparelho? Seus dados continuam salvos na conta.', () => sairDaConta(), { ok: 'Sair' }),
  perfil: () => showSheet(sPerfil()), editPerfil: () => formPerfil(),
  buscar: () => { view = 'aves'; render(); window.scrollTo(0, 0); $('#avesQ').focus(); },
  novaAve: () => formAve(), ave: id => showSheet(sAve(id)), editAve: id => formAve(aveById(id)),
  pesar: id => formManejo({ alvo: 'ave', anilha: aveById(id).anilha, tipo: 'pesagem' }),
  manejoAve: id => formManejo({ alvo: 'ave', anilha: aveById(id).anilha, tipo: 'vermifugacao' }),
  qPeso: () => formManejo({ alvo: 'ave', tipo: 'pesagem' }),
  morte: id => formMorte(id), saida: id => formSaida(id), anilhar: id => formAnilhar([id]),
  anilharPost: id => { const L = filhotesDe(id).filter(a => isSA(a.anilha) && ativa(a)); L.length ? formAnilhar(L.map(a => a.id)) : toast('Nenhum filhote sem anilha'); },
  clubes: () => showSheet(sClubes()), novoClube: () => formClube(), editClube: id => formClube(clube(id)),
  novoLote: id => formLote(null, id), editLote: id => formLote(db.lotesAnilhas.find(l => l.id === id)),
  especies: () => showSheet(sEspecies()), novaEsp: () => formEsp(), editEsp: id => formEsp(especie(id)),
  novoEvento: () => formEvento(), evento: id => showSheet(sEvento(id)), editEvento: id => formEvento(evento(id)),
  novaInsc: id => formInsc(id), insc: id => { const i = db.inscricoes.find(x => x.id === id); formInsc(i.eventoId, i); },
  ck: id => { const [eid, i] = id.split('|'), e = evento(eid); e.checklist[+i].ok = !e.checklist[+i].ok; refresh(); },
  ckAdd: id => openForm({ title: 'Novo item de preparação', fields: [{ k: 't', l: 'Item', req: 1, ph: 'Ex.: Levar ficha de inscrição impressa' }], save: o => { const e = evento(id); (e.checklist = e.checklist || []).push({ t: o.t, ok: false }); } }),
  novoCasal: () => formCasal(), casal: id => showSheet(sCasal(id)), editCasal: id => formCasal(casal(id)),
  separar: id => ask('Separar este casal hoje?', () => { casal(id).dataSeparacao = today(); refresh(); toast('Casal separado'); }, { ok: 'Separar' }),
  reunir: id => { casal(id).dataSeparacao = ''; refresh(); toast('Casal reativado'); },
  novaPostura: id => formPostura(null, id || ''), postura: id => showSheet(sPostura(id)), editPostura: id => formPostura(postura(id)),
  encerrar: id => { postura(id).status = 'encerrada'; refresh(); toast('Postura encerrada'); },
  reabrir: id => { postura(id).status = 'ativa'; refresh(); },
  delPostura: id => {
    ask('Excluir esta postura, seus ovos e o choco? Os filhotes continuam cadastrados.', () => {
    const ch = chocoDe(id);
    db.posturas = db.posturas.filter(p => p.id !== id); db.ovos = db.ovos.filter(o => o.posturaId !== id);
    if (ch) { db.chocos = db.chocos.filter(c => c !== ch); db.chocoEventos = db.chocoEventos.filter(e => e.chocoId !== ch.id); }
    db.aves.forEach(a => { if (a.posturaId === id) a.posturaId = ''; });
    stack.pop(); refresh(); paint(); toast('Postura excluída');
    }, { ok: 'Excluir', danger: true });
  },
  addOvo: id => addOvo(id), ovo: id => formOvo(id), ovoscopia: id => formOvoscopia(id),
  iniciarPost: id => {
    const p = { id: uid(), casalId: id, dataInicio: today(), status: 'ativa', obs: '' };
    db.posturas.push(p); db.ovos.push({ id: uid(), posturaId: p.id, ordem: 1, data: today(), status: 'pendente', obs: '' });
    toast('Postura iniciada · ovo 1 registrado'); refresh();
  },
  choco: id => chocoDe(id) ? showSheet(sChoco(id)) : formChoco(id),
  editChoco: id => { const ch = db.chocos.find(c => c.id === id); formChoco(ch.posturaId, ch); },
  chocoSt: (id, el) => { db.chocos.find(c => c.id === id).status = el.dataset.v; refresh(); toast('Choco: ' + CHOCO[el.dataset.v]); },
  chocoEv: id => formChocoEv(id), editEv: id => { const e = db.chocoEventos.find(x => x.id === id); formChocoEv(e.chocoId, e); },
  nasc: id => formNasc(id),
  pickNasc: id => { stack.pop(); formNasc(id); },
  qOvo: () => showSheet(sPick('addOvo')), qNasc: () => showSheet(sPick('nasc')),
  novoManejo: () => formManejo(), manejo: id => formManejoEdit(id),
  novoLemb: () => formLemb(), lemb: id => formLemb(db.lembretes.find(l => l.id === id)), feito: id => lembFeito(id),
  adiar: id => { const l = db.lembretes.find(x => x.id === id); l.proxima = addDays(l.proxima < today() ? today() : l.proxima, 1); refresh(); },
  goSexoI: () => { Object.assign(F.aves, { q: '', sit: 'ativos', sexo: 'I', cor: '', temp: '', casal: '' }); view = 'aves'; render(); },
  csv: k => exportCSV(k), xls: () => exportXLS(), backup: () => backup(), restore: () => $('#fileIn').click(),
  seed: () => seed(), cfg: () => formCfg(), ajuda: () => showSheet(sAjuda()),
  wipe: () => ask('Apagar TODOS os dados (aves, reprodução, manejo, clubes e campeonatos)? Seu perfil é mantido. Faça um backup antes — esta ação não pode ser desfeita.', () => { const c = db.cfg, pf = db.perfil; db = blank(); db.cfg = c; db.perfil = pf; migrate(db); save(); stack.length = 0; paint(); view = 'home'; render(); }, { ok: 'Apagar tudo', danger: true }),
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.closest('label.seg')) return;
  const fn = ACT[t.dataset.act];
  if (fn) { e.preventDefault(); e.stopPropagation(); fn(t.dataset.id, t); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.f) return;
  const [g, k] = t.dataset.f.split('.');
  F[g][k] = t.value;
  if (t.tagName === 'SELECT' && g === 'rel') { render(); return; }
  if (curList && $('#list')) $('#list').innerHTML = curList();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#dlg').classList.contains('hidden')) { $('#dlgNo').click(); return; }
  if (stack.length) { stack.pop(); paint(); }
});

iniciar();
</script>
</body>
</html>
